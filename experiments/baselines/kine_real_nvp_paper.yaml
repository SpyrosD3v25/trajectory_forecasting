run_name: kine_real_nvp_paper
seed: 42

data:
  raw_roots:
    - data/envship/paper_dma_clean_ship_core_lite_v1
    - data/envship/paper_noaa_clean_ship_core_lite_v1
  processed_root: data/processed/envship_paper_clean_aligned_disp
  train_split: train
  val_split: val
  test_split: test
  dt_seconds: 20.0
  history_steps: 30
  future_steps: 30
  prepare_if_missing: true
  align_to_last_heading: true
  chart_type: displacement

model:
  name: kineroute_nvp
  num_routed_blocks: 6
  hidden_dim: 256
  hidden_layers: 2
  scale_bound: 1.5

loss:
  lambda_velocity: 0.0
  lambda_acceleration: 0.0
  lambda_turn: 0.0
  lambda_feasibility: 0.0
  lambda_reverse: 0.0
  lambda_position_mse: 0.0
  lambda_fde: 0.0
  feasibility_quantile: 0.995

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 8

training:
  epochs: 80
  batch_size: 256
  num_workers: 4
  checkpoint_every_epochs: 10
  early_stopping_patience: 999
  device: cuda

evaluation:
  save_prediction_examples: 24
  evaluate_reverse_mapping: true

output:
  results_root: results
