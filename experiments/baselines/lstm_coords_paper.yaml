run_name: lstm_coords_paper
seed: 42

data:
  raw_roots:
    - data/envship/paper_dma_clean_ship_core_lite_v1
    - data/envship/paper_noaa_clean_ship_core_lite_v1
  processed_root: data/processed/envship_baseline_paper_clean_coords

model:
  name: lstm
  hidden_dim: 128
  num_layers: 2

loss:
  name: mse
  normalize: true
  teacher_forcing_ratio: 0.0

optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001

training:
  epochs: 80
  batch_size: 256
  num_workers: 4
  device: cuda

output:
  results_root: results
