run_name: cpu_smoke
seed: 7

data:
  raw_root: data/envship/track_a_short-term_Cross-domain_Datasets/dma_track_v1
  processed_root: data/processed/envship_dma_smoke
  train_split: train
  val_split: val
  test_split: test
  dt_seconds: 20.0
  history_steps: 30
  future_steps: 30
  prepare_if_missing: true
  max_train_samples: 256
  max_val_samples: 128
  max_test_samples: 128

model:
  name: kineroute_nvp
  num_routed_blocks: 3
  hidden_dim: 64
  hidden_layers: 2
  scale_bound: 1.2

loss:
  lambda_velocity: 0.1
  lambda_acceleration: 0.05
  lambda_turn: 0.05
  lambda_feasibility: 0.01
  lambda_reverse: 0.0
  lambda_position_mse: 0.0
  feasibility_quantile: 0.995

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 2

training:
  epochs: 3
  batch_size: 64
  num_workers: 0
  checkpoint_every_epochs: 1
  early_stopping_patience: 4
  device: cpu

