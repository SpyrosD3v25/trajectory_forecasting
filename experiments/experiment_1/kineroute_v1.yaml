run_name: kineroute_v1
seed: 42

data:
  raw_root: data/envship/track_a_short-term_Cross-domain_Datasets/dma_track_v1
  processed_root: data/processed/envship_dma
  train_split: train
  val_split: val
  test_split: test
  dt_seconds: 20.0
  history_steps: 30
  future_steps: 30
  prepare_if_missing: true

model:
  name: kineroute_nvp
  num_routed_blocks: 6
  hidden_dim: 256
  hidden_layers: 2
  scale_bound: 1.5

loss:
  lambda_velocity: 0.1
  lambda_acceleration: 0.05
  lambda_turn: 0.05
  lambda_feasibility: 0.01
  lambda_reverse: 0.0
  lambda_position_mse: 0.0
  feasibility_quantile: 0.995

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 8

training:
  epochs: 80
  batch_size: 256
  num_workers: 4
  checkpoint_every_epochs: 10
  early_stopping_patience: 15
  device: auto

evaluation:
  save_prediction_examples: 24
  evaluate_reverse_mapping: true

